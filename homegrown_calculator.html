  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'PPRadioGrotesk', sans-serif;
    background: #F0F1EE;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    gap: 10px;
  }

  .card {
    background: #E2E2E2;
    border-radius: 20px;
    width: 100%;
    max-width: 620px;
    overflow: hidden;
  }

  .card-inner { padding: 28px 32px 0; }
  .results-wrap { padding: 28px 32px 32px; }

  .eyebrow {
    font-size: 13px;
    font-weight: 500;
    color: #60605F;
    margin-bottom: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .revenue-label {
    font-size: 20px;
    font-weight: 300;
    color: #303030;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .big-value {
    font-size: 64px;
    font-weight: 400;
    color: #303030;
    line-height: 1;
    margin-bottom: 28px;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }

  .slider-wrap {
    padding-bottom: 28px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }

  input[type="range"] {
    width: 100%;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    background: linear-gradient(to right, #0d7a3e var(--pct, 5%), rgba(0,0,0,0.15) var(--pct, 5%));
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #0d7a3e;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(13,122,62,0.15);
  }

  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #0d7a3e;
    border: none;
    cursor: pointer;
  }

  .get-up-to {
    font-size: 20px;
    font-weight: 300;
    color: #60605F;
    margin-bottom: 10px;
  }

  .get-up-to-val {
    font-size: 64px;
    font-weight: 700;
    color: #0d7a3e;
    line-height: 1;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 28px;
  }

  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 620px;
  }

  .bottom-col {
    background: #E2E2E2;
    border-radius: 16px;
    padding: 20px 20px 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .col-label {
    font-size: 13px;
    font-weight: 400;
    color: #60605F;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .col-val {
    font-size: 20px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .col-val.green { color: #0d7a3e; }
  .col-val.red   { color: #a93226; }

  .col-sublabel {
    font-size: 12px;
    font-weight: 400;
    color: #60605F;
    line-height: 1.4;
    margin-bottom: 16px;
  }

  .col-chart {
    height: 120px;
    overflow: hidden;
    margin-top: 16px;
  }

  /* Mobile styles */
  @media (max-width: 480px) {
    body {
      padding: 12px;
      gap: 8px;
      justify-content: flex-start;
      padding-top: 24px;
    }

    .card {
      border-radius: 16px;
      max-width: 100%;
    }

    .card-inner { padding: 20px 20px 0; }
    .results-wrap { padding: 20px 20px 24px; }

    .revenue-label { font-size: 16px; }

    .big-value {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .get-up-to { font-size: 16px; }

    .get-up-to-val {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .bottom-row {
      max-width: 100%;
      gap: 8px;
    }

    .bottom-col {
      border-radius: 12px;
      padding: 14px 14px 0;
    }

    .col-label { font-size: 11px; margin-bottom: 6px; }

    .col-val { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .col-sublabel { font-size: 11px; }

    .col-chart {
      height: 80px;
      margin-bottom: 16px;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 18px; height: 18px;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-inner">
    <p class="eyebrow">Calculator</p>
    <p class="revenue-label">Your monthly revenue across all locations</p>
    <p class="big-value" id="revenueDisplay">$100,000</p>
    <div class="slider-wrap">
      <input type="range" id="revenueSlider" min="100000" max="1000000" step="10000" value="100000">
    </div>
  </div>
  <div class="results-wrap">
    <p class="get-up-to">Get up to</p>
    <p class="get-up-to-val" id="getUpTo">$250,000</p>
  </div>
</div>

<div class="bottom-row">
  <div class="bottom-col">
    <p class="col-label">Est. Monthly Payment</p>
    <p class="col-val green" id="hgPayment">$9,000 – $11,000</p>
    <p class="col-sublabel">Flexes with your revenue</p>
    <div class="col-chart"><canvas id="chartGood"></canvas></div>
  </div>
  <div class="bottom-col">
    <p class="col-label">Compared to Other Working Capital Loans</p>
    <p class="col-val red" id="otherPayment">$25,000</p>
    <p class="col-sublabel">Same amount. Every month. No matter what.</p>
    <div class="col-chart"><canvas id="chartBad"></canvas></div>
  </div>
</div>

<script>
  const slider = document.getElementById('revenueSlider');
  const MAX_REV = 1000000;

  function fmt(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }

  function update() {
    const rev = parseFloat(slider.value);
    const atMax = rev >= MAX_REV;
    const getUpTo = rev * 2.5;
    const funding = getUpTo;
    const hgLow  = (funding * 1.5) / 48;
    const hgHigh = (funding * 1.35) / 30;
    const other  = (funding * 1.2) / 12;

    document.getElementById('revenueDisplay').textContent = fmt(rev) + (atMax ? '+' : '');
    document.getElementById('getUpTo').textContent = fmt(getUpTo) + (atMax ? '+' : '');
    document.getElementById('hgPayment').textContent = fmt(hgLow) + ' – ' + fmt(hgHigh) + (atMax ? '+' : '');
    document.getElementById('otherPayment').textContent = fmt(other) + (atMax ? '+' : '');

    const pct = ((rev - 100000) / (MAX_REV - 100000)) * 100;
    slider.style.setProperty('--pct', pct + '%');
  }

  slider.addEventListener('input', update);
  update();
</script>

<script>
  function startChart(canvasId, color, wavy) {
    const canvas = document.getElementById(canvasId);
    const parent = canvas.parentElement;
    const W = parent.offsetWidth;
    const H = 100;
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    const BAR_W = 14;
    const GAP   = 3;
    const STEP  = BAR_W + GAP;
    const SPEED = wavy ? 40 : 28;
    const TOTAL = Math.ceil(W / STEP) + 4;

    // pre-bake bar heights indexed by bar number
    function barHeight(idx) {
      if (!wavy) return 0.92;
      // position within visible window determines trend — use modulo so it loops
      const pos = ((idx % TOTAL) + TOTAL) % TOTAL;
      const screenPos = pos / TOTAL;
      const trend = 0.12 + screenPos * 0.80;
      const noise = 0.04 * Math.sin(idx * 2.3) + 0.02 * Math.sin(idx * 5.1);
      return Math.max(0.08, Math.min(1, trend + noise));
    }

    // Use a continuous float offset — never floor it for bar identity
    let offset = 0;
    let lastTs = null;

    function draw(ts) {
      if (lastTs !== null) {
        const delta = (ts - lastTs) / 1000;
        offset += SPEED * delta;
      }
      lastTs = ts;

      ctx.clearRect(0, 0, W, H);

      const startX   = -(offset % STEP);
      const firstIdx = Math.floor(offset / STEP);

      for (let i = 0; i < TOTAL + 1; i++) {
        const x = startX + i * STEP;
        if (x > W + STEP) break;

        const idx = firstIdx + i;

        if (wavy) {
          // gradual upward trend with subtle stagger — no big drop offs
          const CYCLE = 60;
          const pos = idx % CYCLE;
          const trend = 0.32 + (pos / CYCLE) * 0.12; // gradual climb staying around 46%
          const stagger = 0.04 * Math.sin(idx * 1.4) + 0.02 * Math.sin(idx * 3.1);
          const ratio = Math.max(0.1, Math.min(0.46, trend + stagger));
          const h = ratio * H;

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.roundRect(x, H - h, BAR_W, h, [2, 2, 0, 0]);
          ctx.fill();
        } else {
          ctx.fillStyle = color;
          ctx.fillRect(x, 0, BAR_W, H);
        }
      }
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('load', function() {
    startChart('chartGood', '#3ddc84', true);
    startChart('chartBad',  '#f05d5d', false);
  });
</script>
