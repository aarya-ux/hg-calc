<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Homegrown — Funding Calculator</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#F0F1EE;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:10px;}.card{background:#E2E2E2;border-radius:20px;width:100%;max-width:620px;overflow:hidden;}.card-inner{padding:28px 32px 0;}.results-wrap{padding:28px 32px 32px;}.eyebrow{font-size:13px;font-weight:500;color:#60605F;margin-bottom:20px;letter-spacing:0.04em;text-transform:uppercase;}.revenue-label{font-size:20px;font-weight:300;color:#303030;margin-bottom:10px;line-height:1.3;}.big-value{font-size:64px;font-weight:400;color:#303030;line-height:1;margin-bottom:28px;letter-spacing:-0.5px;font-variant-numeric:tabular-nums;}.slider-wrap{padding-bottom:28px;border-bottom:1px solid rgba(0,0,0,0.08);}input[type="range"]{width:100%;height:3px;-webkit-appearance:none;appearance:none;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,#0d7a3e var(--pct,5%),rgba(0,0,0,0.15) var(--pct,5%));}input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#0d7a3e;cursor:pointer;box-shadow:0 0 0 4px rgba(13,122,62,0.15);}input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#0d7a3e;border:none;cursor:pointer;}.get-up-to{font-size:20px;font-weight:300;color:#60605F;margin-bottom:10px;}.get-up-to-val{font-size:64px;font-weight:700;color:#0d7a3e;line-height:1;letter-spacing:-0.5px;font-variant-numeric:tabular-nums;margin-bottom:28px;}.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px;}.bottom-col{background:#E2E2E2;border-radius:16px;padding:20px;display:flex;flex-direction:column;overflow:hidden;}.col-label{font-size:13px;font-weight:400;color:#60605F;margin-bottom:10px;line-height:1.4;}.col-val{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-0.5px;line-height:1;margin-bottom:8px;}.col-val.green{color:#0d7a3e;}.col-val.red{color:#a93226;}.col-sublabel{font-size:12px;font-weight:400;color:#60605F;line-height:1.4;margin-bottom:16px;}@media (max-width:480px){body{padding:12px;gap:8px;justify-content:flex-start;padding-top:24px;}.card{border-radius:16px;max-width:100%;}.card-inner{padding:20px 20px 0;}.results-wrap{padding:20px 20px 24px;}.revenue-label{font-size:16px;}.big-value{font-size:42px;margin-bottom:20px;}.get-up-to{font-size:16px;}.get-up-to-val{font-size:42px;margin-bottom:20px;}.bottom-row{max-width:100%;gap:8px;}.bottom-col{border-radius:12px;padding:14px 14px 0;}.col-label{font-size:11px;margin-bottom:6px;}.col-val{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.col-sublabel{font-size:11px;}input[type="range"]::-webkit-slider-thumb{width:18px;height:18px;}}</style></head><body><div class="card"><div class="card-inner"><p class="eyebrow">Calculator</p><p class="revenue-label">Your monthly revenue across all locations</p><p class="big-value" id="revenueDisplay">$100,000</p><div class="slider-wrap"><input type="range" id="revenueSlider" min="100000" max="1000000" step="10000" value="100000"></div></div><div class="results-wrap"><p class="get-up-to">Get up to</p><p class="get-up-to-val" id="getUpTo">$250,000</p></div></div><div class="bottom-row"><div class="bottom-col"><p class="col-label">Est. Monthly Payment</p><p class="col-val green" id="hgPayment">$9,000 – $11,000</p><p class="col-sublabel">Flexes with your revenue</p></div><div class="bottom-col"><p class="col-label">Compared to Other Working Capital Loans</p><p class="col-val red" id="otherPayment">$25,000</p><p class="col-sublabel">Same amount. Every month. No matter what.</p></div></div><script>const slider = document.getElementById('revenueSlider'); const MAX_REV = 1000000; function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); } function update() { const rev = parseFloat(slider.value); const atMax = rev >= MAX_REV; const getUpTo = rev * 2.5; const funding = getUpTo; const hgLow = (funding * 1.5) / 48; const hgHigh = (funding * 1.35) / 30; const other = (funding * 1.2) / 12; document.getElementById('revenueDisplay').textContent = fmt(rev) + (atMax ? '+' : ''); document.getElementById('getUpTo').textContent = fmt(getUpTo) + (atMax ? '+' : ''); document.getElementById('hgPayment').textContent = fmt(hgLow) + ' – ' + fmt(hgHigh) + (atMax ? '+' : ''); document.getElementById('otherPayment').textContent = fmt(other) + (atMax ? '+' : ''); const pct = ((rev - 100000) / (MAX_REV - 100000)) * 100; slider.style.setProperty('--pct', pct + '%'); } slider.addEventListener('input', update); update();</script></body></html>
